# CI humo B1 — copiar a .github/workflows/ del repo del estudiante / monorepo.
# Corre tests del servicio DML sin requerir Docker (TestClient).

name: b1-smoke

on:
  push:
    paths:
      - "04_notebooks_produccion_hf/B1_fastapi_dml/**"
      - "04_notebooks_produccion_hf/autograder/grade_b1.py"
      - "03_notebooks_caso_estudio/artifacts/A2/**"
      - "03_notebooks_caso_estudio/lib/**"
  pull_request:
    paths:
      - "04_notebooks_produccion_hf/B1_fastapi_dml/**"
      - "04_notebooks_produccion_hf/autograder/grade_b1.py"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04_notebooks_produccion_hf/B1_fastapi_dml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install B1 deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync A2 artifacts (if present in monorepo)
        run: |
          python scripts/sync_a2_artifacts.py || true
          test -f artifacts/dml_estimator.joblib

      - name: Pytest B1
        env:
          PYTHONPATH: ${{ github.workspace }}/03_notebooks_caso_estudio:${{ github.workspace }}/04_notebooks_produccion_hf/B1_fastapi_dml
        run: pytest tests/ -q

      - name: Autograder B1
        env:
          PYTHONPATH: ${{ github.workspace }}/03_notebooks_caso_estudio:${{ github.workspace }}/04_notebooks_produccion_hf/B1_fastapi_dml
        run: python ../autograder/grade_b1.py
