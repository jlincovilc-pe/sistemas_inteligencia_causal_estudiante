# Optional conda environment for Serie A notebooks.
name: causal-serie-a
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - seaborn>=0.13
  - statsmodels>=0.14
  - networkx>=3.0
  - joblib>=1.3
  - pyyaml>=6.0
  - jupyter>=1.0
  - nbformat>=5.9
  - nbconvert>=7.0
  - pytest>=7.0
  - pip
  - pip:
      - econml>=0.15
      - doubleml>=0.7
