limitations:
- Lalonde/NSW reference effect is an experimental estimate with sampling uncertainty,
  not a mathematical constant.
- The expert DAG is a maintained adjustment graph based on documented pre-treatment
  covariates; it is not uniquely learned from the data.
- Data are public for attributable non-commercial use according to the NBER/Dehejia-Wahba
  page; users must cite the original sources.
